[pytest]
# -----------------------------------------------------------------------------
# Pytest CLI Defaults
# -ra      : Show extra test summary info for (a)ll except passed
# --tb     : Use 'short' tracebacks (TF/Ansible output is long enough already)
# -q       : Quiet mode (reduces pytest's internal clutter)
# -----------------------------------------------------------------------------
addopts = -ra --tb=short

# Define where your tests live so pytest doesn't search your entire repo
testpaths = 
    tests

# -----------------------------------------------------------------------------
# Live Logging
# This ensures you see Terraform and Ansible output in real-time 
# as it happens, rather than waiting for the test to finish.
# -----------------------------------------------------------------------------
log_cli = True
log_cli_level = INFO
log_cli_format = %(message)s

# -----------------------------------------------------------------------------
# Custom Markers
# Allows you to run specific suites: `pytest -m terraform`
# -----------------------------------------------------------------------------
markers =
    terraform   : Tests that provision or verify Terraform infrastructure
    ansible     : Tests that configure instances via Ansible
    policy      : Tests that evaluate Rego/OPA policies via ConfTest
    destructive : Tests that destroy infrastructure (good to exclude locally)
    provision   : Tests provisioning

# -----------------------------------------------------------------------------
# Warning Filters
# Ignore standard dependency warnings that clutter infrastructure runs
# -----------------------------------------------------------------------------
filterwarnings =
    # Ignore unverified HTTPS warnings if Vault or vCenter uses self-signed certs
    ignore:Unverified HTTPS request is being made.*:urllib3.exceptions.InsecureRequestWarning
    # Ignore hvac deprecation warnings that you have no control over
    ignore::DeprecationWarning:hvac.*
